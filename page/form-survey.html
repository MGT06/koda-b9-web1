<html lang="en">

    <title>Document</title>

  <body>
    <h2>Survey Form</h2>
    <form border="1">
      <label for="name">Nama</label>
      <input type="text" name="" id="name" />
      <br />
      <label for="umur">Umur</label>
      <input type="text" name="" id="umur" />
      <br />
      <p>Jenis Kelamin :</p>
      <label for="p">Perempuan</label>
      <input type="radio" name="jk" id="p" />
      <label for="l">laki-laki</label>
      <input type="radio" name="jk" id="l" />
      <br />
      <p>Apakah anda hobi menonton film?</p>
      <select>
        <option value="" disabled selected>Pilih</option>
        <option value="ya">Ya</option>
        <option value="tidak">Tidak</option>
      </select>
      <br />
      <p>Pilih Genre:</p>
      <label for="action">Action</label>
      <input type="checkbox" name="" id="action" />
      <label for="horor">Horor</label>
      <input type="checkbox" name="" id="horor" />
      <label for="komedi">Komedi</label>
      <input type="checkbox" name="" id="komedi" />
      <label for="drama">Drama</label>
      <input type="checkbox" name="" id="drama" />
      <label for="romance">Romance</label>
      <input type="checkbox" name="romance" />
      <br />
      <input type="button" value="Submit">
    </form>
  </body>
</html>
